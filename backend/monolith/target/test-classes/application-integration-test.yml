spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: localhost
    port: 1025
  main:
    allow-bean-definition-overriding: true

jiangou:
  auth:
    registration-enabled: false
  search:
    engine: mysql

logging:
  level:
    com.jiangou: INFO
    org.flywaydb: WARN
