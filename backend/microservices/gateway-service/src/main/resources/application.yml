server:
  port: 9000

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        # 迁移期：未拆分路径仍走 monolith
        - id: monolith-fallback
          uri: ${MONOLITH_URI:http://localhost:8080}
          predicates:
            - Path=/api/**

        # 以下为拆分后路由（启用微服务时取消注释并关闭 fallback 或调整 order）
