global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: jiangou-backend
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials: __PROMETHEUS_SCRAPE_TOKEN__
    static_configs:
      - targets: ['backend:8080']
        labels:
          service: backend
