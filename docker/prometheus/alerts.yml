groups:
  - name: jiangou-backend
    rules:
      - alert: BackendDown
        expr: up{job="jiangou-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 渐构后端不可达
          description: Prometheus 无法抓取 backend:8080 指标，持续 1 分钟。

      - alert: HighHttp5xxRate
        expr: sum(rate(http_server_requests_seconds_count{job="jiangou-backend",status=~"5.."}[5m])) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: HTTP 5xx 错误率偏高
          description: 后端 5xx 请求速率超过 0.05 req/s，持续 2 分钟。

      - alert: JvmHeapUsageHigh
        expr: |
          jvm_memory_used_bytes{job="jiangou-backend",area="heap"}
          / jvm_memory_max_bytes{job="jiangou-backend",area="heap"} > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: JVM 堆内存使用率超过 90%
          description: 后端 JVM heap 使用率持续 5 分钟超过 90%。
